[package]
name = "sshweave"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line tool for composable SSH configuration and resilient gateway routing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mingcheng/sshweave"
homepage = "https://github.com/mingcheng/sshweave"
documentation = "https://github.com/mingcheng/sshweave/blob/HEAD/examples/README.md"
authors = ["mingcheng <mingcheng@apache.org>"]
keywords = ["ssh", "openssh", "cli", "proxy", "gateway"]
categories = ["command-line-utilities", "config", "network-programming"]
exclude = [
  ".github/",
  ".vscode/",
  ".editorconfig",
  ".gitattributes",
  "scripts/",
  "sshweave.webp",
]

[[bin]]
name = "sshweave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
fs2 = "0.4"
glob = "0.3"
hostname = "0.4"
indexmap = { version = "2", features = ["serde"] }
minijinja = { version = "3", features = ["builtins", "json", "serde"] }
ptree = { version = "0.5", default-features = false, features = ["ansi"] }
rand = "0.10"
regex = "1"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
shell-words = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = { version = "1.1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
format_push_string = "warn"
todo = "warn"
uninlined_format_args = "warn"

[profile.release]
lto = "thin"
strip = true
