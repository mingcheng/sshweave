name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release.py metadata --tag "$RELEASE_TAG"
          else
            python3 scripts/release.py metadata
          fi

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Test native target
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --all-targets --locked --target "$TARGET"
      - name: Build native release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package binary, documentation, and completions
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release.py package \
            --target "$TARGET" \
            --binary "target/$TARGET/release/sshweave" \
            --epoch "$(git log -1 --format=%ct)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/release.py verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-release
          path: dist
      - name: Verify artifacts and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py publish \
            --tag "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

  publish-crates:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: crates-io
      - name: Prepare and verify the crate before authentication
        run: cargo package --locked --registry crates-io --target-dir target
      - name: Check for an identical published version
        id: crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py crate-status \
            --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io with OIDC
        if: ${{ steps.crate.outputs.published == 'false' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish the crate
        if: ${{ steps.crate.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io --target-dir target
