name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release.py metadata --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/release.py metadata --github-output "$GITHUB_OUTPUT"
          fi

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Test native target
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --all-targets --locked --target "$TARGET"
      - name: Build native release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package binary, documentation, and completions
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release.py package \
            --target "$TARGET" \
            --binary "target/$TARGET/release/sshweave" \
            --epoch "$(git log -1 --format=%ct)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/release.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist
      - name: Recheck archive integrity before publishing
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
