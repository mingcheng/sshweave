name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        toolchain: [stable, "1.88"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: tooling
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_docs.py
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml .github/workflows/release.yml
      - run: cargo build --release --locked
      - name: Validate crates.io package without publishing
        run: cargo publish --dry-run --locked --registry crates-io
      - name: Check resolver performance budget
        id: benchmark
        run: python3 scripts/benchmark.py --max-regex-ms 250 > target/benchmark.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        with:
          name: resolver-benchmark
          path: target/benchmark.json
          if-no-files-found: error
          retention-days: 14
